<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="shell" x1=".15" y1="0" x2=".85" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ffffff"/><stop offset=".48" stop-color="#e7eef0"/><stop offset="1" stop-color="#c4d2d7"/></linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfb"/><stop offset="1" stop-color="#dce6e8"/></linearGradient>
    <linearGradient id="orbit" x1=".15" y1="0" x2=".8" y2="1"><stop stop-color="#70959d"/><stop offset=".45" stop-color="#436677"/><stop offset="1" stop-color="#304c5c"/></linearGradient>
    <linearGradient id="companion" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#93b8ac"/><stop offset="1" stop-color="#517c76"/></linearGradient>
    <radialGradient id="core" cx=".3" cy=".24" r=".8"><stop stop-color="#a6c7c4"/><stop offset=".35" stop-color="#688f96"/><stop offset="1" stop-color="#345465"/></radialGradient>
    <filter id="relief" x="-25%" y="-25%" width="150%" height="155%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#213d4b" flood-opacity=".18"/></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#shell)" stroke="#81999f" stroke-opacity=".4" stroke-width="2"/>
  <rect x="12" y="12" width="232" height="230" rx="56" fill="none" stroke="#ffffff" stroke-opacity=".86" stroke-width="2"/>
  <rect x="27" y="27" width="202" height="202" rx="43" fill="url(#plate)" stroke="#ffffff" stroke-opacity=".72" stroke-width="2"/>
